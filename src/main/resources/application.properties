spring.application.name=predictivemaintain-platform
spring.profiles.default=dev

# Filled by Maven resource filtering
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n (the default language, English, is set in LocaleConfiguration)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Security
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.password-reset.expiration-minutes=30


# We authenticate with our own JWT filter, so Spring Boot must not create a default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# Weather (Open-Meteo: free, no API key). WEATHER_BASE_URL lets you point it elsewhere to test failures.
app.weather.base-url=${WEATHER_BASE_URL:https://api.open-meteo.com}
app.weather.timeout-seconds=3


# Evidence photos: stored on local disk for now. Max 5 MB per file.
app.evidence.storage-dir=${EVIDENCE_STORAGE_DIR:./data/evidence}
app.evidence.max-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Telemetry
app.telemetry.min-interval-seconds=${TELEMETRY_MIN_INTERVAL_SECONDS:1}
app.telemetry.alert-cooldown-seconds=${TELEMETRY_ALERT_COOLDOWN_SECONDS:600}
app.telemetry.communication-timeout-seconds=${TELEMETRY_COMMUNICATION_TIMEOUT_SECONDS:300}

app.telemetry.rul-critical-hours=${TELEMETRY_RUL_CRITICAL_HOURS:168}


# Email (SMTP). Leave MAIL_HOST empty and the email channel stays off: nothing is sent, and it is recorded as SKIPPED.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@predictivemaintain.local}

# Push (Firebase Cloud Messaging). The service account key, as JSON or Base64. Empty = push stays off.
app.fcm.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
# Must match the notification channel the Android app creates
app.fcm.android-channel-id=${FCM_ANDROID_CHANNEL_ID:alerts}

# Notifications
app.notifications.locale=${NOTIFICATIONS_LOCALE:es}
# Daily subscription expiry notice. Default: 14:00 UTC = 09:00 in Lima. Seconds Minutes Hours Day Month DayOfWeek
app.notifications.expiry-cron=${NOTIFICATIONS_EXPIRY_CRON:0 0 14 * * *}


# Actuator: only the health endpoint is exposed. Platforms call it to know whether the app is alive.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true