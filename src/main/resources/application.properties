spring.application.name=predictivemaintain-platform
spring.profiles.default=dev

# Filled by Maven resource filtering
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n (the default language, English, is set in LocaleConfiguration)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Security
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.password-reset.expiration-minutes=30


# We authenticate with our own JWT filter, so Spring Boot must not create a default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration