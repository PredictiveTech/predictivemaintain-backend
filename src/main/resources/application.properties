spring.application.name=predictivemaintain-platform
spring.profiles.default=dev

# Filled by Maven resource filtering
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n (the default language, English, is set in LocaleConfiguration)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Security
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.password-reset.expiration-minutes=30


# We authenticate with our own JWT filter, so Spring Boot must not create a default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# Weather (Open-Meteo: free, no API key). WEATHER_BASE_URL lets you point it elsewhere to test failures.
app.weather.base-url=${WEATHER_BASE_URL:https://api.open-meteo.com}
app.weather.timeout-seconds=3


# Evidence photos: stored on local disk for now. Max 5 MB per file.
app.evidence.storage-dir=${EVIDENCE_STORAGE_DIR:./data/evidence}
app.evidence.max-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB