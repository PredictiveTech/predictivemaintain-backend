# PRODUCTION profile (SPRING_PROFILES_ACTIVE=prod).
# Every secret comes from an environment variable and NONE has a default value:
# if one is missing the application refuses to start instead of running with a known value.

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}${DATABASE_PARAMS:}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate creates and updates the tables. There are no migration scripts yet (see "Decisiones abiertas").
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

server.port=${PORT:8080}
# The platform ends HTTPS and forwards plain HTTP: trust its X-Forwarded-* headers so Swagger builds https URLs.
server.forward-headers-strategy=framework
# On a restart, finish the requests in progress before stopping.
server.shutdown=graceful

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:https://localhost/reset-password}
app.password-reset.log-links=${PASSWORD_RESET_LOG_LINKS:false}